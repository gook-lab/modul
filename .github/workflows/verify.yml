name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # test:a11y 는 storybook test-runner(playwright)로 실제 브라우저를 띄웁니다.
      - run: pnpm --filter @modul/storybook exec playwright install --with-deps chromium
      - run: pnpm --filter @modul/tokens build
      - run: pnpm gen:stories && git diff --exit-code -- 'packages/ui/src/**/*.stories.tsx'
      - run: pnpm lint
      - run: pnpm typecheck
      # -r 이어야 @modul/motion 의 presets.test.ts 까지 돕니다.
      - run: pnpm -r test
      - run: pnpm -r build && npx size-limit
      - run: pnpm --filter @modul/storybook build
      - run: pnpm --filter @modul/storybook test:a11y   # storybook test-runner + axe (color-contrast 포함)
