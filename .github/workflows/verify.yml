name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 버전은 package.json 의 packageManager 하나가 정합니다 — 여기 version 을 같이 주면 충돌합니다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # test:a11y 는 vitest 브라우저 모드(playwright)로 스토리를 실제로 렌더합니다.
      - run: pnpm --filter @modul/storybook exec playwright install --with-deps chromium
      - run: pnpm --filter @modul/tokens build
      - run: pnpm gen:stories && git diff --exit-code -- 'packages/ui/src/**/*.stories.tsx'
      - run: pnpm lint
      - run: pnpm typecheck
      # -r 이어야 @modul/motion 의 presets.test.ts 까지 돕니다.
      - run: pnpm -r test
      - run: pnpm -r build && npx size-limit
      - run: pnpm --filter @modul/storybook build
      - run: pnpm --filter @modul/storybook test:a11y   # addon-a11y + axe (color-contrast 포함)
