<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>패키지 의존 관계 · Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f3f2f2;
      --color-ink:     #201e1d;
      --color-muted:   #444141;
      --color-soft:    #605d5d;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-soft);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Dependency graph · packages</p>
    <h1>패키지 의존 관계 — packages 다섯 개와 소비 앱</h1>

    <svg viewBox="0 56 1000 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="package-deps-title package-deps-desc">
      <title id="package-deps-title">패키지 의존 관계</title>
      <desc id="package-deps-desc">소비 앱과 packages 의 의존 방향을 계층으로 보여 준다. tokens 에는 네 곳이 기대고 있고, 순환은 없다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444141"/></marker>
      </defs>

      <rect x="0" y="0" width="1000" height="728" fill="#f3f2f2"/>

      <!-- Connectors first. Solid = dependencies, dashed = peerDependencies. -->
      <g fill="none" stroke="#444141" stroke-width="1" marker-end="url(#arrow)">
        <!-- apps/* -> icons -->
        <path d="M160 184 V264"/>
        <!-- apps/* -> ui, motion, tokens: three attach points on the right edge of the app box -->
        <path d="M280 132 H332 A8 8 0 0 1 340 140 V292 A8 8 0 0 0 348 300 H400"/>
        <path d="M280 152 H308 A8 8 0 0 1 316 160 V444 A8 8 0 0 0 324 452 H400"/>
        <path d="M280 172 H292 A8 8 0 0 1 300 180 V600 A8 8 0 0 0 308 608 H400"/>
        <!-- ui -> motion -->
        <path d="M520 336 V416"/>
        <!-- motion -> tokens (peer) -->
        <path d="M520 488 V568" stroke-dasharray="5,4"/>
        <!-- malt-ui -> ui (peer) -->
        <path d="M520 184 V264" stroke-dasharray="5,4"/>
        <!-- ui -> tokens (peer), right-side corridor past motion -->
        <path d="M640 300 H664 A8 8 0 0 1 672 308 V584 A8 8 0 0 1 664 592 H640" stroke-dasharray="5,4"/>
        <!-- malt-ui -> tokens (peer), outer corridor -->
        <path d="M640 160 H688 A8 8 0 0 1 696 168 V608 A8 8 0 0 1 688 616 H640" stroke-dasharray="5,4"/>
      </g>

      <!-- apps (consumers) -->
      <rect x="40" y="112" width="240" height="72" rx="6" fill="#f3f2f2"/>
      <rect x="40" y="112" width="240" height="72" rx="6" fill="#ffffff" stroke="#201e1d" stroke-width="1"/>
      <text x="160" y="144" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">소비 앱</text>
      <text x="160" y="164" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">apps/admin</text>
      <text x="160" y="178" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">apps/portfolio</text>
      <rect x="212" y="120" width="40" height="18" rx="2" fill="#f3f2f2" stroke="rgba(32,30,29,0.30)" stroke-width="0.8"/>
      <text x="232" y="133" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">0 in</text>

      <!-- malt-ui -->
      <rect x="400" y="112" width="240" height="72" rx="6" fill="#f3f2f2"/>
      <rect x="400" y="112" width="240" height="72" rx="6" fill="#ffffff" stroke="#201e1d" stroke-width="1"/>
      <text x="520" y="144" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">malt 전용 UI</text>
      <text x="520" y="164" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">@gook-lab/malt-ui 0.1.3</text>
      <text x="520" y="178" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">peer: tokens · ui</text>
      <rect x="572" y="120" width="40" height="18" rx="2" fill="#f3f2f2" stroke="rgba(32,30,29,0.30)" stroke-width="0.8"/>
      <text x="592" y="133" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">0 in</text>

      <!-- game-kit (no internal edges) -->
      <rect x="720" y="112" width="240" height="72" rx="6" fill="#f3f2f2"/>
      <rect x="720" y="112" width="240" height="72" rx="6" fill="rgba(32,30,29,0.05)" stroke="#444141" stroke-width="1"/>
      <text x="840" y="144" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">게임 공용</text>
      <text x="840" y="164" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">@gook-lab/game-kit 0.1.0</text>
      <text x="840" y="178" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">내부 의존 없음</text>
      <rect x="892" y="120" width="40" height="18" rx="2" fill="#f3f2f2" stroke="rgba(32,30,29,0.30)" stroke-width="0.8"/>
      <text x="912" y="133" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">0 in</text>

      <!-- icons (leaf) -->
      <rect x="40" y="264" width="240" height="72" rx="6" fill="#f3f2f2"/>
      <rect x="40" y="264" width="240" height="72" rx="6" fill="rgba(32,30,29,0.05)" stroke="#444141" stroke-width="1"/>
      <text x="160" y="296" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">아이콘</text>
      <text x="160" y="316" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">@gook-lab/icons 0.1.0</text>
      <text x="160" y="330" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">lucide-react ^0.440</text>
      <rect x="212" y="272" width="40" height="18" rx="2" fill="#f3f2f2" stroke="rgba(32,30,29,0.30)" stroke-width="0.8"/>
      <text x="232" y="285" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">1 in</text>

      <!-- ui -->
      <rect x="400" y="264" width="240" height="72" rx="6" fill="#f3f2f2"/>
      <rect x="400" y="264" width="240" height="72" rx="6" fill="#ffffff" stroke="#201e1d" stroke-width="1"/>
      <text x="520" y="296" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">UI 컴포넌트</text>
      <text x="520" y="316" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">@gook-lab/ui 0.2.7</text>
      <text x="520" y="330" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">deps: motion · peer: tokens</text>
      <rect x="572" y="272" width="40" height="18" rx="2" fill="#f3f2f2" stroke="rgba(32,30,29,0.30)" stroke-width="0.8"/>
      <text x="592" y="285" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">2 in</text>

      <!-- motion -->
      <rect x="400" y="416" width="240" height="72" rx="6" fill="#f3f2f2"/>
      <rect x="400" y="416" width="240" height="72" rx="6" fill="#ffffff" stroke="#201e1d" stroke-width="1"/>
      <text x="520" y="448" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">모션</text>
      <text x="520" y="468" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">@gook-lab/motion 0.2.7</text>
      <text x="520" y="482" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">peer: tokens</text>
      <rect x="572" y="424" width="40" height="18" rx="2" fill="#f3f2f2" stroke="rgba(32,30,29,0.30)" stroke-width="0.8"/>
      <text x="592" y="437" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">2 in</text>

      <!-- tokens (leaf, highest fan-in) -->
      <rect x="400" y="568" width="240" height="72" rx="6" fill="#f3f2f2"/>
      <rect x="400" y="568" width="240" height="72" rx="6" fill="rgba(32,30,29,0.05)" stroke="#444141" stroke-width="1"/>
      <text x="520" y="600" fill="#201e1d" font-size="16" font-weight="600" font-family="'Noto Sans KR', sans-serif" text-anchor="middle">토큰</text>
      <text x="520" y="620" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">@gook-lab/tokens 0.2.7</text>
      <text x="520" y="634" fill="#605d5d" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">styles.css · theme.json</text>
      <rect x="572" y="576" width="40" height="18" rx="2" fill="#f3f2f2" stroke="rgba(32,30,29,0.30)" stroke-width="0.8"/>
      <text x="592" y="589" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">4 in</text>

      <!-- Legend strip -->
      <line x1="40" y1="672" x2="920" y2="672" stroke="rgba(32,30,29,0.12)" stroke-width="0.8"/>
      <line x1="40" y1="700" x2="72" y2="700" stroke="#444141" stroke-width="1"/>
      <text x="84" y="704" fill="#444141" font-size="12" font-family="'Geist Mono', monospace">dependencies</text>
      <line x1="232" y1="700" x2="264" y2="700" stroke="#444141" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="276" y="704" fill="#444141" font-size="12" font-family="'Geist Mono', monospace">peerDependencies</text>
      <rect x="464" y="688" width="40" height="18" rx="2" fill="#f3f2f2" stroke="rgba(32,30,29,0.30)" stroke-width="0.8"/>
      <text x="484" y="701" fill="#444141" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">N in</text>
      <text x="516" y="704" fill="#444141" font-size="12" font-family="'Noto Sans KR', sans-serif" font-weight="500">이 패키지에 기대는 쪽의 수</text>
    </svg>
  </div>
</body>
</html>
